# Majordomo — repository operations for evolving software.
# Org-wide defaults for the control tower (xynova/majordomo-tower).
# Per-repo files deep-merge on top: majordomo-central-config/<repo-id>.yaml

trigger:
  poll: true
  interval: 5m
  push:
    mode: none

cache:
  repo: served
  retentionDays: 120
  # Analysis-cache skips are on by default. Opt out with:
  # disableSkips: true

pollCache:
  repo: served
  # branch defaults to majordomo-poll-cache/<repo-id>

context:
  repo: served
  # branch defaults to majordomo-context/<repo-id>
  # autoMerge: false
  # gateCommentPrefix: "@majordomo"
  # compaction:
  #   maxChronologyEntries: 40
  #   keepRecentEntries: 10
  # maxCommitsPerRun: 20

review:
  publishMode: auto
  # false: review each open PR/MR once (until cursor cleared).
  # true: re-queue whenever head_sha changes.
  enableContinuousRuns: true

pipelines:
  pr-review:
    # model: anthropic/claude-sonnet-4-5
    # scoreModel: auto
    routing:
      pr-review-docs:
        - "**/*.md"
        - "**/*.rst"
      pr-review-conf:
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.toml"
        - "**/*.json"
        - "**/*.ini"
        - "**/*.cfg"
        - "**/*.env"
        - "**/*.xml"
      pr-review-code:
        - "**"

# Named AI providers. Tasks without a job_configs entry fall back to the
# embedded gateway using MAJORDOMO_MODEL / pipelines.pr-review.model.
# Secrets stay in env vars; interpolate with ${VAR}.
#
# Context digest uses local Polypus (:1320) → Cloudflare Workers AI.
# Typology cluster/refine and story modules use Gemma 4 (gpt-oss kept as an alternate provider).
# Requires Polypus running with INFERENCE_CLOUD_CASE=1 and CF credentials.
ai_providers:
  polypus_gemma:
    api_schema: openai
    api_key: local
    model: "@cf/google/gemma-4-26b-a4b-it"
    base_url: "http://127.0.0.1:1320/v1"
    timeout: "120s"
  polypus_gpt_oss:
    api_schema: openai
    api_key: local
    model: "@cf/openai/gpt-oss-20b"
    base_url: "http://127.0.0.1:1320/v1"
    timeout: "120s"

job_configs:
  context-digest:
    modules:
      typology_cluster:
        provider: polypus_gemma
      typology_refine:
        provider: polypus_gemma
      typology_human_intervention:
        provider: polypus_gemma
      bootstrap_story:
        provider: polypus_gemma
      digest_story:
        provider: polypus_gemma

