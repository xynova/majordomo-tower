# Majordomo — repository operations for evolving software.
# Org-wide defaults for the control tower (xynova/majordomo-tower).
# Per-repo files deep-merge on top: majordomo-central-config/<repo-id>.yaml

trigger:
  poll: true
  interval: 5m
  push:
    mode: none

cache:
  repo: served
  retentionDays: 120
  # Analysis-cache skips are on by default. Opt out with:
  # disableSkips: true

pollCache:
  repo: served
  # branch defaults to majordomo-poll-cache/<repo-id>

review:
  publishMode: auto
  # false: review each open PR/MR once (until cursor cleared).
  # true: re-queue whenever head_sha changes.
  enableContinuousRuns: false

pipelines:
  pr-review:
    # model: anthropic/claude-sonnet-4-5
    # scoreModel: auto
    routing:
      pr-review-docs:
        - "**/*.md"
        - "**/*.rst"
      pr-review-conf:
        - "**/*.yml"
        - "**/*.yaml"
        - "**/*.toml"
        - "**/*.json"
        - "**/*.ini"
        - "**/*.cfg"
        - "**/*.env"
        - "**/*.xml"
      pr-review-code:
        - "**"

