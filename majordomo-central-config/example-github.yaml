# Example GitHub served-repo config (copy to <repo_id>.yaml and edit).
# Secret: GH_TOKEN_YOUR_ORG (optional override MAJORDOMO_CREDENTIAL_EXAMPLE_GITHUB).
# Org defaults live in _defaults.yaml — only override what differs.

scm: github

repository:
  id: example-github
  owner: YOUR_ORG
  name: YOUR_REPO
  cloneUrl: https://github.com/YOUR_ORG/YOUR_REPO.git
