# Majordomo context digest — tower cron (same 5m floor as poll).
# Canonical workflow shape: .majordomo/pipelines/github-actions/tower/majordomo-context-digest.yml
name: majordomo-context-digest

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_compact:
        description: "Run chronology compaction even when under threshold"
        required: false
        default: "false"
        type: boolean
      repo_id:
        description: "Optional single repo id (default: all digest targets)"
        required: false
        type: string
      majordomo_image:
        description: "Optional majordomo CLI image override (default: vars.MAJORDOMO_IMAGE)"
        required: false
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      MAJORDOMO_GH_IMAGE: ${{ vars.MAJORDOMO_GH_IMAGE }}
      MAJORDOMO_GLAB_IMAGE: ${{ vars.MAJORDOMO_GLAB_IMAGE }}
      MAJORDOMO_IMAGE: ${{ github.event.inputs.majordomo_image || vars.MAJORDOMO_IMAGE }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract majordomo CLI from image
        run: bash "${TOWER_SCRIPTS}/extract-majordomo-cli.sh" "${MAJORDOMO_IMAGE}" "${{ github.workspace }}/majordomo"

      - name: Plan digest targets
        id: plan
        run: |
          set -euo pipefail
          ./majordomo context repos \
            --config-dir majordomo-central-config \
            --out context-repos.json
          count=$(jq '.repos | length' context-repos.json)
          echo "Digest targets: ${count}"
          if [ "${count}" = "0" ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matrix=$(bash "${TOWER_SCRIPTS}/enrich-context-repos-matrix.sh" context-repos.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Upload majordomo CLI
        uses: actions/upload-artifact@v6
        with:
          name: majordomo-cli
          path: majordomo
          if-no-files-found: error

  digest:
    needs: plan
    if: needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.forge_image }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      group: context-digest-${{ matrix.repo_id }}
      cancel-in-progress: false
    env:
      REPO_ID: ${{ matrix.repo_id }}
      SCM: ${{ matrix.scm }}
      OWNER: ${{ matrix.owner }}
      NAME: ${{ matrix.name }}
      CLONE_URL: ${{ matrix.clone_url }}
      GH_TOKEN_XYNOVA: ${{ secrets.GH_TOKEN_XYNOVA }}
      GH_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GH_TOKEN_BEHAVIORENGINEERING }}
      GITLAB_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GITLAB_TOKEN_BEHAVIORENGINEERING }}
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOWER_SCRIPTS: .majordomo/pipelines/scripts/tower
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download majordomo CLI
        uses: actions/download-artifact@v6
        with:
          name: majordomo-cli
          path: .

      - name: Make majordomo executable
        run: |
          set -euo pipefail
          ls -la
          chmod +x ./majordomo
          test -x ./majordomo

      - name: Verify forge CLI on PATH
        run: bash "${TOWER_SCRIPTS}/verify-forge-cli.sh"

      - name: Clone served repo and run context digest
        env:
          MAJORDOMO_REPO_ID: ${{ matrix.repo_id }}
        run: |
          set -euo pipefail
          bash "${TOWER_SCRIPTS}/clone-served-repo.sh" served/repo
          ./majordomo context digest \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --workdir "${PWD}/served/repo" \
            $( [ "${{ github.event.inputs.force_compact }}" = "true" ] && echo "--force-compact" ) | tee digest-result.json
          action=$(jq -r '.action' digest-result.json)
          echo "Digest action: ${action}"

      - name: Upload digest result
        uses: actions/upload-artifact@v6
        with:
          name: context-digest-${{ matrix.repo_id }}
          path: digest-result.json
          if-no-files-found: ignore
