# Faster context gate regen — trigger digest for one served repo without waiting for cron.
name: majordomo-context-gate

on:
  repository_dispatch:
    types: [context-gate]
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Served repo id (required)"
        required: true
        type: string
      force_compact:
        description: "Run compaction even when under threshold"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  digest:
    runs-on: ubuntu-latest
    concurrency:
      group: context-digest-${{ github.event.client_payload.repo_id || github.event.inputs.repo_id }}
      cancel-in-progress: false
    env:
      REPO_ID: ${{ github.event.client_payload.repo_id || github.event.inputs.repo_id }}
      FORCE_COMPACT: ${{ github.event.client_payload.force_compact || github.event.inputs.force_compact }}
      GH_TOKEN_XYNOVA: ${{ secrets.GH_TOKEN_XYNOVA }}
      GH_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GH_TOKEN_BEHAVIORENGINEERING }}
      GITLAB_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GITLAB_TOKEN_BEHAVIORENGINEERING }}
      BITBUCKET_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: .majordomo/go.mod
          cache-dependency-path: .majordomo/go.sum

      - name: Build majordomo
        run: go build -o "${{ github.workspace }}/majordomo" ./cmd/majordomo
        working-directory: .majordomo

      - name: Resolve repo metadata
        id: meta
        run: |
          set -euo pipefail
          ./majordomo context repos --config-dir majordomo-central-config --out repos.json
          row=$(jq -c --arg id "${REPO_ID}" '.repos[] | select(.repo_id == $id)' repos.json)
          if [ -z "${row}" ]; then
            echo "Unknown repo_id: ${REPO_ID}"
            exit 1
          fi
          echo "scm=$(jq -r '.scm' <<<"${row}")" >> "$GITHUB_OUTPUT"
          echo "owner=$(jq -r '.owner' <<<"${row}")" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r '.name' <<<"${row}")" >> "$GITHUB_OUTPUT"
          echo "clone_url=$(jq -r '.clone_url' <<<"${row}")" >> "$GITHUB_OUTPUT"

      - name: Run context digest (gate acceleration)
        env:
          SCM: ${{ steps.meta.outputs.scm }}
          OWNER: ${{ steps.meta.outputs.owner }}
          NAME: ${{ steps.meta.outputs.name }}
          CLONE_URL: ${{ steps.meta.outputs.clone_url }}
          MAJORDOMO_REPO_ID: ${{ env.REPO_ID }}
        run: |
          set -euo pipefail
          repo_key=$(echo "${REPO_ID}" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')
          owner_key=$(echo "${OWNER}" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')
          per_repo_var="MAJORDOMO_CREDENTIAL_${repo_key}"
          token="${!per_repo_var:-}"
          if [ -z "${token}" ]; then
            case "${SCM}" in
              gitlab)
                org_var="GITLAB_TOKEN_${owner_key}"
                token="${!org_var:-}"
                ;;
              bitbucket)
                token="${BITBUCKET_TOKEN:-}"
                ;;
              *)
                org_var="GH_TOKEN_${owner_key}"
                token="${!org_var:-}"
                ;;
            esac
          fi
          if [ -z "${token}" ]; then
            echo "No credential for ${REPO_ID}"
            exit 1
          fi
          case "${SCM}" in
            gitlab) auth_url=$(echo "${CLONE_URL}" | sed "s#https://#https://oauth2:${token}@#") ;;
            bitbucket) auth_url=$(echo "${CLONE_URL}" | sed "s#https://#https://x-token-auth:${token}@#") ;;
            *) auth_url=$(echo "${CLONE_URL}" | sed "s#https://#https://x-access-token:${token}@#") ;;
          esac
          mkdir -p served
          git clone --depth 500 "${auth_url}" served/repo
          git -C served/repo fetch --depth 500 origin
          git -C served/repo remote set-url origin "${CLONE_URL}"
          extra=""
          if [ "${FORCE_COMPACT}" = "true" ]; then extra="--force-compact"; fi
          ./majordomo context digest \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --workdir "${{ github.workspace }}/served/repo" \
            ${extra} | tee digest-result.json
