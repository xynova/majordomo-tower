# Majordomo review job — invoked by poll or repository_dispatch (push modes).
# Canonical workflow shape: .majordomo/pipelines/github-actions/tower/majordomo-review.yml
name: majordomo-review

on:
  repository_dispatch:
    types: [majordomo-review]
  workflow_dispatch:
    inputs:
      repo_id:
        description: Served repo id (majordomo-central-config/<repo_id>.yaml)
        required: true
        type: string
      review_id:
        description: Dedup key scm:owner/repo:change_id:head_sha
        required: false
        type: string
      pr_number:
        description: PR/MR number
        required: true
        type: string
      head_sha:
        description: Head commit SHA to review
        required: true
        type: string
      base_branch:
        description: Base branch name
        required: true
        type: string
      clone_url:
        description: HTTPS clone URL of served repo
        required: true
        type: string
      scm:
        description: github|gitlab|bitbucket
        required: false
        default: github
        type: string
      publish_mode:
        description: auto|comment|description
        required: false
        default: auto
        type: string
      owner:
        description: Forge owner/group path (for publish)
        required: false
        type: string
      name:
        description: Forge repo/project name (for publish)
        required: false
        type: string
      forge_image:
        description: Optional majordomo-gh / majordomo-glab image override
        required: false
        type: string

concurrency:
  group: majordomo-${{ github.event.client_payload.review_id || inputs.review_id || format('{0}-{1}', inputs.repo_id, inputs.pr_number) }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: write
  statuses: write

jobs:
  prepare-cli:
    runs-on: ubuntu-latest
    env:
      MAJORDOMO_IMAGE: ${{ vars.MAJORDOMO_IMAGE }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract majordomo CLI from image
        run: bash "${TOWER_SCRIPTS}/extract-majordomo-cli.sh" "${MAJORDOMO_IMAGE}" "${{ github.workspace }}/majordomo"

      - name: Upload majordomo CLI
        uses: actions/upload-artifact@v7
        with:
          name: majordomo-cli
          path: majordomo
          if-no-files-found: error

  review:
    needs: prepare-cli
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.client_payload.forge_image || inputs.forge_image || ((github.event.client_payload.scm || inputs.scm || 'github') == 'gitlab' && vars.MAJORDOMO_GLAB_IMAGE) || ((github.event.client_payload.scm || inputs.scm || 'github') == 'github' && vars.MAJORDOMO_GH_IMAGE) || '' }}
    defaults:
      run:
        shell: bash
    env:
      REPO_ID: ${{ github.event.client_payload.repo_id || inputs.repo_id }}
      REVIEW_ID: ${{ github.event.client_payload.review_id || inputs.review_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr || inputs.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      BASE_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch }}
      CLONE_URL: ${{ github.event.client_payload.clone_url || inputs.clone_url }}
      SCM: ${{ github.event.client_payload.scm || inputs.scm || 'github' }}
      PUBLISH_MODE: ${{ github.event.client_payload.publish_mode || inputs.publish_mode || 'auto' }}
      OWNER: ${{ github.event.client_payload.owner || inputs.owner }}
      NAME: ${{ github.event.client_payload.name || inputs.name }}
      # Served-repo org tokens (add rows when onboarding a new org/group).
      GH_TOKEN_XYNOVA: ${{ secrets.GH_TOKEN_XYNOVA }}
      GH_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GH_TOKEN_BEHAVIORENGINEERING }}
      GITLAB_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GITLAB_TOKEN_BEHAVIORENGINEERING }}
      # LLM auth for embedded Bifrost Account (Judge talks OpenAI loopback only).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MAJORDOMO_MODEL: ${{ vars.MAJORDOMO_MODEL }}
      TOWER_SCRIPTS: .majordomo/pipelines/scripts/tower
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download majordomo CLI
        uses: actions/download-artifact@v8
        with:
          name: majordomo-cli
          path: .

      - name: Make majordomo executable
        run: |
          set -euo pipefail
          chmod +x ./majordomo
          test -x ./majordomo

      - name: Verify forge CLI on PATH
        if: env.SCM == 'github' || env.SCM == 'gitlab'
        run: bash "${TOWER_SCRIPTS}/verify-forge-cli.sh"

      - name: Restore poll cursor cache
        uses: actions/cache@v5
        with:
          path: .poll-cache
          key: majordomo-poll-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            majordomo-poll-cache-${{ runner.os }}-

      - name: Run review
        env:
          COPILOT_PIPELINE: pr-review
          MAJORDOMO_SCRIPTS: .majordomo/pipelines/scripts
          MAJORDOMO_SA_IMAGE_PREFIX: ${{ vars.MAJORDOMO_SA_IMAGE_PREFIX }}
          MAJORDOMO_SA_IMAGE_TAG: ${{ vars.MAJORDOMO_SA_IMAGE_TAG }}
          MAJORDOMO_REPO_ID: ${{ env.REPO_ID }}
        run: |
          set -euo pipefail
          ./majordomo run review \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --pr "${PR_NUMBER}" \
            --head-sha "${HEAD_SHA}" \
            --base-branch "${BASE_BRANCH}" \
            --clone-url "${CLONE_URL}" \
            --workdir "${PWD}/served/repo" \
            --staging-dir "${PWD}/staging/${REPO_ID}-pr-${PR_NUMBER}" \
            --output-dir "${PWD}/review-output/${REPO_ID}/pr-review" \
            --scripts-dir "${MAJORDOMO_SCRIPTS}" \
            --cursor-dir .poll-cache \
            --publish

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-${{ env.REPO_ID }}-pr-${{ env.PR_NUMBER }}
          path: |
            review-output/
            **/logs/inference-failures/
          if-no-files-found: ignore
