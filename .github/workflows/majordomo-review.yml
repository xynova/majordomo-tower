# Majordomo review job — invoked by poll or repository_dispatch (push modes).
#
# Forge job containers (recommended for github|gitlab publish):
#   Set repository variable MAJORDOMO_FORGE_IMAGE to your registry tag, e.g.
#     ghcr.io/org/majordomo-gh:<sha>   or   …/majordomo-glab:<sha>
#   Or pass forge_image via workflow_dispatch / client_payload.
#   Then uncomment the `container:` block below (empty image names fail the job).
# Majordomo Go binary is built in-job into the workspace; it shells to gh/glab on PATH.
name: majordomo-review

on:
  repository_dispatch:
    types: [majordomo-review]
  workflow_dispatch:
    inputs:
      repo_id:
        description: Served repo id (majordomo-central-config/<repo_id>.yaml)
        required: true
        type: string
      review_id:
        description: Dedup key scm:owner/repo:change_id:head_sha
        required: false
        type: string
      pr_number:
        description: PR/MR number
        required: true
        type: string
      head_sha:
        description: Head commit SHA to review
        required: true
        type: string
      base_branch:
        description: Base branch name
        required: true
        type: string
      clone_url:
        description: HTTPS clone URL of served repo
        required: true
        type: string
      scm:
        description: github|gitlab|bitbucket
        required: false
        default: github
        type: string
      publish_mode:
        description: auto|comment|description
        required: false
        default: auto
        type: string
      owner:
        description: Forge owner/group path (for publish)
        required: false
        type: string
      name:
        description: Forge repo/project name (for publish)
        required: false
        type: string
      forge_image:
        description: Optional majordomo-gh / majordomo-glab image (document in job container)
        required: false
        type: string

concurrency:
  group: majordomo-${{ github.event.client_payload.review_id || inputs.review_id || format('{0}-{1}', inputs.repo_id, inputs.pr_number) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Uncomment when MAJORDOMO_FORGE_IMAGE or forge_image is always set for this tower:
    # container:
    #   image: ${{ github.event.client_payload.forge_image || inputs.forge_image || vars.MAJORDOMO_FORGE_IMAGE }}
    env:
      REPO_ID: ${{ github.event.client_payload.repo_id || inputs.repo_id }}
      REVIEW_ID: ${{ github.event.client_payload.review_id || inputs.review_id }}
      PR_NUMBER: ${{ github.event.client_payload.pr || inputs.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      BASE_BRANCH: ${{ github.event.client_payload.base_branch || inputs.base_branch }}
      CLONE_URL: ${{ github.event.client_payload.clone_url || inputs.clone_url }}
      SCM: ${{ github.event.client_payload.scm || inputs.scm || 'github' }}
      PUBLISH_MODE: ${{ github.event.client_payload.publish_mode || inputs.publish_mode || 'auto' }}
      OWNER: ${{ github.event.client_payload.owner || inputs.owner }}
      NAME: ${{ github.event.client_payload.name || inputs.name }}
      FORGE_IMAGE: ${{ github.event.client_payload.forge_image || inputs.forge_image || vars.MAJORDOMO_FORGE_IMAGE }}
      # Served-repo org tokens (add rows when onboarding a new org/group).
      GH_TOKEN_XYNOVA: ${{ secrets.GH_TOKEN_XYNOVA }}
      GH_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GH_TOKEN_BEHAVIORENGINEERING }}
      GITLAB_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GITLAB_TOKEN_BEHAVIORENGINEERING }}
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .majordomo/go.mod
          cache-dependency-path: .majordomo/go.sum

      - name: Build majordomo
        run: go build -o "${{ github.workspace }}/majordomo" ./cmd/majordomo
        working-directory: .majordomo

      - name: Ensure forge CLI on PATH (host runner fallback)
        if: env.SCM == 'github' || env.SCM == 'gitlab'
        run: |
          set -euo pipefail
          if [ -n "${FORGE_IMAGE:-}" ]; then
            echo "FORGE_IMAGE=${FORGE_IMAGE} — prefer running this job with container.image set to that tag"
          fi
          if [ "${SCM}" = "github" ] && ! command -v gh >/dev/null 2>&1; then
            echo "Installing GitHub CLI (gh) on runner…"
            (type -p wget >/dev/null || (sudo apt-get update && sudo apt-get install -y wget))
            sudo mkdir -p -m 755 /etc/apt/keyrings
            out=$(mktemp)
            wget -nv -O"$out" https://cli.github.com/packages/githubcli-archive-keyring.gpg
            cat "$out" | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
            sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
              | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update && sudo apt-get install -y gh
            gh --version
          fi
          if [ "${SCM}" = "gitlab" ] && ! command -v glab >/dev/null 2>&1; then
            echo "glab missing — use majordomo-glab job container (MAJORDOMO_FORGE_IMAGE) or install glab on the runner"
            exit 1
          fi

      - name: Resolve served-repo credential
        id: cred
        run: |
          set -euo pipefail
          # Match majordomo ResolveCredential: per-repo override, then org/group token.
          # Org secrets must already be in job env (see GH_TOKEN_* / GITLAB_TOKEN_* above).
          repo_key=$(echo "${REPO_ID}" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')
          owner_key=$(echo "${OWNER}" | tr '[:lower:]' '[:upper:]' | sed 's/[^A-Z0-9]/_/g')
          per_repo_var="MAJORDOMO_CREDENTIAL_${repo_key}"
          token="${!per_repo_var:-}"
          if [ -z "${token}" ]; then
            if [ "${SCM}" = "gitlab" ]; then
              org_var="GITLAB_TOKEN_${owner_key}"
            else
              org_var="GH_TOKEN_${owner_key}"
            fi
            token="${!org_var:-}"
          fi
          if [ -z "${token}" ]; then
            echo "No credential for ${REPO_ID} (set MAJORDOMO_CREDENTIAL_${repo_key} or org token for owner ${OWNER})"
            exit 1
          fi
          echo "Resolved credential for ${REPO_ID} (owner=${OWNER})"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Clone served repository
        env:
          TOKEN: ${{ steps.cred.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p served
          auth_url=$(echo "${CLONE_URL}" | sed "s#https://#https://x-access-token:${TOKEN}@#")
          git clone --depth 50 "${auth_url}" served/repo
          git -C served/repo fetch --depth 50 origin "${HEAD_SHA}"
          git -C served/repo checkout --force "${HEAD_SHA}"
          git -C served/repo remote set-url origin "${CLONE_URL}"
          # Ensure origin/<base> exists for prep three-dot diff
          git -C served/repo fetch --depth 50 origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}" || \
            git -C served/repo fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

      - name: Restore poll cursor cache
        uses: actions/cache@v4
        with:
          path: .poll-cache
          key: majordomo-poll-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            majordomo-poll-cache-${{ runner.os }}-

      - name: Static analysis (from central config)
        env:
          MAJORDOMO_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts
          MAJORDOMO_SA_IMAGE_PREFIX: ${{ vars.MAJORDOMO_SA_IMAGE_PREFIX }}
          MAJORDOMO_SA_IMAGE_TAG: ${{ vars.MAJORDOMO_SA_IMAGE_TAG }}
        run: |
          set -euo pipefail
          ./majordomo sa \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --repo-root "${{ github.workspace }}/served/repo" \
            --base-branch "${BASE_BRANCH}" \
            --scripts-dir "${MAJORDOMO_SCRIPTS}" || true
          echo "SA finished (missing images are non-fatal)"

      - name: Orchestrate review
        env:
          COPILOT_PIPELINE: pr-review
          MAJORDOMO_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts
        run: |
          set -euo pipefail
          STAGING="${{ github.workspace }}/staging/${REPO_ID}-pr-${PR_NUMBER}"
          OUTPUT="${{ github.workspace }}/review-output/${REPO_ID}/pr-review"
          mkdir -p "${STAGING}" "${OUTPUT}"
          # OpenCode agent may be a separate container later; dispatch fails without provider keys.
          ./majordomo orchestrate \
            --pr "${PR_NUMBER}" \
            --base-branch "${BASE_BRANCH}" \
            --staging-dir "${STAGING}" \
            --output-dir "${OUTPUT}" \
            --repo-root "${{ github.workspace }}/served/repo" \
            --scripts-dir "${MAJORDOMO_SCRIPTS}" \
            --config-dir majordomo-central-config \
            --repo-id "${REPO_ID}" \
            --skip-report=false || true
          echo "Orchestrate finished (check logs for dispatch/agent availability)"

      - name: Publish summary (if present)
        env:
          MAJORDOMO_REPO_ID: ${{ env.REPO_ID }}
          GITHUB_REPOSITORY: ${{ env.OWNER }}/${{ env.NAME }}
        run: |
          set -euo pipefail
          SUMMARY="${{ github.workspace }}/review-output/${REPO_ID}/pr-review/summary.md"
          if [ ! -f "${SUMMARY}" ]; then
            SUMMARY=$(find "${{ github.workspace }}/review-output/${REPO_ID}" -name summary.md | head -n1 || true)
          fi
          if [ -z "${SUMMARY}" ] || [ ! -f "${SUMMARY}" ]; then
            echo "No summary.md — skip publish"
            exit 0
          fi
          # Token comes from job env GH_TOKEN_* / GITLAB_TOKEN_* / MAJORDOMO_CREDENTIAL_* via ResolveCredential.
          ./majordomo publish --scm "${SCM}" --owner "${OWNER}" --repo "${NAME}" \
            --repo-id "${REPO_ID}" \
            "${PR_NUMBER}" "${SUMMARY}" "${PUBLISH_MODE}"

      - name: Update poll cursor
        run: |
          set -euo pipefail
          mkdir -p ".poll-cache/${REPO_ID}"
          ./majordomo cache poll-set ".poll-cache/${REPO_ID}/poll-cursor.json" \
            --pr "${PR_NUMBER}" --sha "${HEAD_SHA}"

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ env.REPO_ID }}-pr-${{ env.PR_NUMBER }}
          path: review-output/
          if-no-files-found: ignore
