# Majordomo poll — reconciliation (GitHub Actions cron floor: 5 minutes).
# Extracts majordomo CLI from MAJORDOMO_IMAGE and queues review workflows for new PR heads.
name: majordomo-poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      MAJORDOMO_IMAGE: ${{ vars.MAJORDOMO_IMAGE }}
      TOWER_SCRIPTS: ${{ github.workspace }}/.majordomo/pipelines/scripts/tower
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Extract majordomo CLI from image
        run: bash "${TOWER_SCRIPTS}/extract-majordomo-cli.sh" "${MAJORDOMO_IMAGE}" "${{ github.workspace }}/majordomo"

      - name: Restore poll cursor cache
        uses: actions/cache@v5
        with:
          path: .poll-cache
          key: majordomo-poll-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            majordomo-poll-cache-${{ runner.os }}-

      # Served-repo tokens (map each org secret explicitly; Actions has no dynamic secret names).
      # Lookup in majordomo: MAJORDOMO_CREDENTIAL_<REPO_ID> then GH_TOKEN_<OWNER> / GITLAB_TOKEN_<OWNER>.
      - name: Discover pending reviews
        env:
          GH_TOKEN_XYNOVA: ${{ secrets.GH_TOKEN_XYNOVA }}
          GH_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GH_TOKEN_BEHAVIORENGINEERING }}
          GITLAB_TOKEN_BEHAVIORENGINEERING: ${{ secrets.GITLAB_TOKEN_BEHAVIORENGINEERING }}
        run: |
          mkdir -p .poll-cache
          ./majordomo poll \
            --config-dir majordomo-central-config \
            --cursor-dir .poll-cache \
            --out pending-reviews.json
          echo "---- pending-reviews.json ----"
          cat pending-reviews.json

      - name: Queue review workflows
        env:
          # Tower Actions token only (gh workflow run on this repo).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(jq '.reviews | length' pending-reviews.json)
          echo "Pending reviews: ${count}"
          if [ "${count}" = "0" ]; then
            echo "Nothing to queue"
            exit 0
          fi
          jq -c '.reviews[]' pending-reviews.json | while read -r row; do
            repo_id=$(echo "$row" | jq -r '.repo_id')
            review_id=$(echo "$row" | jq -r '.review_id')
            pr=$(echo "$row" | jq -r '.pr')
            head_sha=$(echo "$row" | jq -r '.head_sha')
            base_branch=$(echo "$row" | jq -r '.base_branch')
            clone_url=$(echo "$row" | jq -r '.clone_url')
            scm=$(echo "$row" | jq -r '.scm')
            publish_mode=$(echo "$row" | jq -r '.publish_mode // "auto"')
            owner=$(echo "$row" | jq -r '.owner')
            name=$(echo "$row" | jq -r '.name')
            echo "Queueing review for ${repo_id} PR #${pr} @ ${head_sha}"
            gh workflow run majordomo-review.yml \
              --repo "${{ github.repository }}" \
              -f repo_id="${repo_id}" \
              -f review_id="${review_id}" \
              -f pr_number="${pr}" \
              -f head_sha="${head_sha}" \
              -f base_branch="${base_branch}" \
              -f clone_url="${clone_url}" \
              -f scm="${scm}" \
              -f publish_mode="${publish_mode}" \
              -f owner="${owner}" \
              -f name="${name}"
          done

      - name: Upload pending artifact
        uses: actions/upload-artifact@v7
        with:
          name: pending-reviews
          path: pending-reviews.json
          if-no-files-found: ignore
