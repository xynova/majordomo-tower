# Build and push majordomo-gh / majordomo-glab to tower GHCR.
# Source Dockerfiles live in the .majordomo submodule.
name: majordomo-forge-images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".majordomo/dockerfiles/Dockerfile.gh"
      - ".majordomo/dockerfiles/Dockerfile.glab"
      - ".majordomo/pipelines/scripts/build-copilot-image.sh"
      - ".github/workflows/majordomo-forge-images.yml"
  pull_request:
    paths:
      - ".majordomo/dockerfiles/Dockerfile.gh"
      - ".majordomo/dockerfiles/Dockerfile.glab"
      - ".majordomo/pipelines/scripts/build-copilot-image.sh"
      - ".github/workflows/majordomo-forge-images.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/xynova/majordomo-tower

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: majordomo-gh
            dockerfile: dockerfiles/Dockerfile.gh
            smoke_cmd: gh --version
          - image_name: majordomo-glab
            dockerfile: dockerfiles/Dockerfile.glab
            smoke_cmd: glab --version
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build forge image
        working-directory: .majordomo
        env:
          DOCKER_BUILD_TARGET: public
          SKIP_PUSH: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          REGISTRY_USR: ${{ github.actor }}
          REGISTRY_PSW: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.sha }}"
          bash ./pipelines/scripts/build-copilot-image.sh \
            "${REGISTRY}" \
            "${{ matrix.image_name }}" \
            "${tag}" \
            "${{ matrix.dockerfile }}"

      - name: Smoke forge CLI
        run: |
          set -euo pipefail
          docker run --rm "${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}" \
            sh -c '${{ matrix.smoke_cmd }} && echo OK'

      - name: Tag and push latest (default branch)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          set -euo pipefail
          src="${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}"
          latest="${REGISTRY}/${{ matrix.image_name }}:latest"
          docker tag "${src}" "${latest}"
          docker push "${latest}"
          echo "Pushed ${latest}"
