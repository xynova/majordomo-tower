# Build and push majordomo-gh / majordomo-glab to tower GHCR.
# Canonical workflow shape: .majordomo/pipelines/github-actions/tower/majordomo-forge-images.yml
name: majordomo-forge-images

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".majordomo/dockerfiles/Dockerfile.gh"
      - ".majordomo/dockerfiles/Dockerfile.glab"
      - ".majordomo/dockerfiles/Dockerfile.cli"
      - ".majordomo/go.mod"
      - ".majordomo/go.sum"
      - ".majordomo/cmd/**"
      - ".majordomo/internal/**"
      - ".majordomo/pipelines/scripts/**"
      - ".github/workflows/majordomo-forge-images.yml"
  pull_request:
    paths:
      - ".majordomo/dockerfiles/Dockerfile.gh"
      - ".majordomo/dockerfiles/Dockerfile.glab"
      - ".majordomo/dockerfiles/Dockerfile.cli"
      - ".majordomo/go.mod"
      - ".majordomo/go.sum"
      - ".majordomo/cmd/**"
      - ".majordomo/internal/**"
      - ".majordomo/pipelines/scripts/**"
      - ".github/workflows/majordomo-forge-images.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/xynova/majordomo-tower

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: majordomo-gh
            dockerfile: Dockerfile.gh
            smoke_cmd: gh --version
          - image_name: majordomo-glab
            dockerfile: Dockerfile.glab
            smoke_cmd: glab --version
          - image_name: majordomo
            dockerfile: Dockerfile.cli
            smoke_cmd: ""
    steps:
      - name: Checkout tower (with submodule)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        env:
          SKIP_PUSH: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          REGISTRY_USR: ${{ github.actor }}
          REGISTRY_PSW: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.image_name }}" != "majordomo" ]; then
            export DOCKER_BUILD_TARGET=public
          fi
          bash .majordomo/pipelines/scripts/tower/build-forge-image.sh \
            "${REGISTRY}" \
            "${{ matrix.image_name }}" \
            "${{ github.sha }}" \
            "${{ matrix.dockerfile }}"

      - name: Smoke forge CLI
        if: matrix.image_name != 'majordomo'
        run: |
          set -euo pipefail
          docker run --rm "${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}" \
            sh -c '${{ matrix.smoke_cmd }} && echo OK'

      - name: Smoke majordomo CLI
        if: matrix.image_name == 'majordomo'
        run: |
          set -euo pipefail
          docker run --rm "${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}" --help >/dev/null
          bash .majordomo/pipelines/scripts/tower/extract-majordomo-cli.sh \
            "${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}" \
            "${{ github.workspace }}/majordomo-from-image"
          echo OK

      - name: Tag and push latest (default branch)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          set -euo pipefail
          src="${REGISTRY}/${{ matrix.image_name }}:${{ github.sha }}"
          latest="${REGISTRY}/${{ matrix.image_name }}:latest"
          docker tag "${src}" "${latest}"
          docker push "${latest}"
          echo "Pushed ${latest}"
